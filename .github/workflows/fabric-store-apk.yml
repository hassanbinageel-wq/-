name: Fabric Store APK

# يبني تطبيق «دفتر الأقمشة» لأندرويد وينشره كـ Release فيه ملف APK جاهز للتثبيت
on:
  push:
    paths:
      - 'fabric-store/**'
      - '.github/workflows/fabric-store-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabric-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-store
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      APP_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fabric-store/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (accounting logic)
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: fabric-store/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/fabric-store-${VERSION_NAME}.apk"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabric-store-apk
          path: fabric-store/out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fabric-store-v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: دفتر الأقمشة ${{ env.VERSION_NAME }}
          make_latest: true
          body: |
            تطبيق «دفتر الأقمشة» لإدارة تجارة الأقمشة بالجملة — الإصدار ${{ env.VERSION_NAME }}

            **التثبيت:** حمّل ملف `fabric-store-${{ env.VERSION_NAME }}.apk` من الأسفل على جوالك وافتحه (فعّل «السماح بالتثبيت من هذا المصدر» عند الطلب).
            التحديث يُثبَّت فوق النسخة السابقة وتبقى بياناتك كما هي.

            أول دخول: المستخدم «المدير» والرمز السري `1234` — غيّره من الإعدادات.
          files: fabric-store/out/*.apk
