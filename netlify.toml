# نشر متجر المواليد (مجلد baby-store) على Netlify — الخطة المجانية
# المتغير المطلوب في إعدادات الموقع على Netlify: DATABASE_URL (رابط قاعدة Supabase)
[build]
  base = "baby-store"
  command = "npm run build:netlify"
  publish = ".next"
  # لا يُعاد النشر (ولا يُستهلك رصيد) إذا لم يتغير شيء داخل baby-store — مثل تعديلات مجلد brand
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# محوّل Next.js على Netlify (مثبت بإصدار محدد في package.json)
[[plugins]]
  package = "@netlify/plugin-nextjs"
