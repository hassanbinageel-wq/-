<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ابتسم — أثر يُقاس</title>
<style>
  /* Tajawal بديل DIN Next LT Arabic (خط الهوية التجاري). عربي + لاتيني بنفس العائلة */
  @font-face { font-family:'T'; font-weight:300; src:url('node_modules/@fontsource/tajawal/files/tajawal-arabic-300-normal.woff2') format('woff2'); unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F,U+066B-066C; }
  @font-face { font-family:'T'; font-weight:500; src:url('node_modules/@fontsource/tajawal/files/tajawal-arabic-500-normal.woff2') format('woff2'); unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F,U+066B-066C; }
  @font-face { font-family:'T'; font-weight:800; src:url('node_modules/@fontsource/tajawal/files/tajawal-arabic-800-normal.woff2') format('woff2'); unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F,U+066B-066C; }
  @font-face { font-family:'T'; font-weight:500; src:url('node_modules/@fontsource/tajawal/files/tajawal-latin-500-normal.woff2') format('woff2'); unicode-range:U+0000-00FF; }
  @font-face { font-family:'T'; font-weight:800; src:url('node_modules/@fontsource/tajawal/files/tajawal-latin-800-normal.woff2') format('woff2'); unicode-range:U+0000-00FF; }

  :root { --navy:#294285; --teal:#0C86A7; --turq:#13AEA6; --cyan:#00AEEF; --grey:#6D6D6F; --light:#E2E3E2; --gold:#C9A93A; --ink:#FFFFFF; --soft:#DDF3F8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#000; overflow:hidden; }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--navy); color:var(--ink); font-family:'T',sans-serif; transform-origin:0 0; }
  #grad { position:absolute; inset:0; background:linear-gradient(160deg, var(--navy) 0%, var(--teal) 58%, var(--cyan) 115%); }
  .scene { position:absolute; inset:0; visibility:hidden; }
  .row-c { position:absolute; left:0; right:0; display:flex; justify-content:center; text-align:center; white-space:nowrap; }
  .w { display:inline-block; }
  #line { position:absolute; inset:0; z-index:4; overflow:visible; }
  #line path { fill:none; stroke:#fff; stroke-width:12; stroke-linecap:round; vector-effect:non-scaling-stroke; }

  /* ١ المشكلة */
  #t1 { top:560px; font:500 62px 'T'; color:var(--soft); }
  #t1 .w { margin:0 8px; }
  #big { top:630px; font:800 300px 'T'; line-height:1.15; }
  #t2 { top:1000px; font:800 74px 'T'; }
  #t2 .w { margin:0 10px; }

  /* ٢ التحوّل */
  #t3 { top:620px; font:500 66px 'T'; color:var(--soft); }
  #t3 .w { margin:0 8px; }
  #t4 { top:690px; font:800 250px 'T'; line-height:1.2; }
  #t5 { top:1010px; font:500 50px 'T'; line-height:1.5; color:var(--soft); white-space:normal; }
  #t5 .w { margin:0 6px; }

  /* ٣ الأثر */
  .stat { position:absolute; left:0; right:0; top:0; text-align:center; }
  .stat b { display:block; font:800 176px 'T'; line-height:1.1; }
  .stat span { display:block; font:500 56px 'T'; color:var(--soft); margin-top:-6px; }
  #foot { top:1330px; font:500 44px 'T'; color:var(--soft); }

  /* ٤ الختام */
  #logo { position:absolute; left:330px; top:470px; width:420px; transform-origin:50% 50%; }
  #slogan { top:900px; font:300 66px 'T'; line-height:1.3; }
  #sl-curve { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:visible; }
  #sl-curve path { fill:none; stroke:#fff; stroke-width:7; stroke-linecap:round; }
  #cta-wrap { top:1170px; }
  #cta { position:relative; overflow:hidden; display:inline-block; padding:24px 70px 30px; border-radius:60px; background:#fff; color:var(--navy); font:800 54px 'T'; }
  #sheen { position:absolute; top:0; bottom:0; left:0; width:140px; background:linear-gradient(100deg, transparent, rgba(0,174,239,.35), transparent); }
  #url { top:1315px; font:500 46px 'T'; direction:ltr; letter-spacing:1px; }
</style>
</head>
<body>
<div id="stage">
  <div id="grad"></div>

  <section class="scene" id="s1">
    <div class="row-c" id="t1"></div>
    <div class="row-c" id="big"><span class="w" id="bigv"></span></div>
    <div class="row-c" id="t2"></div>
  </section>

  <section class="scene" id="s2">
    <div class="row-c" id="t3"></div>
    <div class="row-c" id="t4"><span class="w" id="name">ابتسم</span></div>
    <div class="row-c" id="t5"><div id="t5in" style="max-width:760px"></div></div>
  </section>

  <section class="scene" id="s3">
    <div class="stat" id="r0"><b>٠</b><span>خدمة علاجية</span></div>
    <div class="stat" id="r1"><b>٠</b><span>مستفيد ومستفيدة</span></div>
    <div class="stat" id="r2"><b>٠</b><span>عملية تخدير كامل</span></div>
    <div class="row-c" id="foot"><span class="w" id="footw">خلال ٧ سنوات من العطاء</span></div>
  </section>

  <section class="scene" id="s4">
    <img id="logo" src="assets/logo_white.png" alt="">
    <div class="row-c" id="slogan"><span class="w" id="slw">ابتسامة أسنان<br>تقربكم للجنان</span></div>
    <svg id="sl-curve" viewBox="0 0 1080 1920"><path id="slc" pathLength="1" d="M 700 1080 C 660 1140, 500 1142, 440 1092"/></svg>
    <div class="row-c" id="cta-wrap"><div id="cta">كن شريكنا في الأثر<div id="sheen"></div></div></div>
    <div class="row-c" id="url"><span class="w" id="urlw">ibtsm.org.sa</span></div>
  </section>

  <!-- خط الابتسامة: الحامل الوحيد عبر الفيلم كله -->
  <svg id="line" viewBox="0 0 1080 1920"><g id="lg"><path id="front" pathLength="1"/><path id="back" pathLength="1"/></g></svg>
</div>

<script src="lib/motion.js"></script>
<script>
const FILM = { width: 1080, height: 1920, fps: 30, duration: 15, bpm: 100, cuts: [] };
const B = M.grid(FILM.bpm);                // نبضة = 0.6 ث
const { sp, set, clamp, lerp, ease, range, track } = M;
const T_FLIP = 3.6, T_STATS = [6.0, 7.8, 9.6], T_LEAF = 11.7;
const VALUES = [54932, 45614, 124];
const fmt = n => M.arDigits(String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',')).replace(/,/g, '٬');

// ---------------------------------------------------------------- خط الابتسامة
function drawLine(t) {
  const w = 380;
  // الانحناء: مستقيم ← عبوس ← ابتسامة (playful) ← ابتسامة هادئة + نبضة مع كل رقم ← ورقة
  let b = track(t, [[0, 0], [0.9, -78], [T_FLIP, 165], [5.5, 48]], 'base');
  if (t >= T_FLIP && t < 5.5) b = -78 + (165 + 78) * sp(t - T_FLIP, 'playful');
  for (const ts of T_STATS) if (t > ts + .35) b += 55 * Math.exp(-(t - ts - .35) * 5) * Math.sin(Math.min(Math.PI, (t - ts - .35) * 9));
  const morph = sp(t - T_LEAF, 'base');
  b = lerp(b, 190, morph);
  const b2 = lerp(b, -190, morph);
  const cy = track(t, [[0, 1150], [5.45, 1250], [T_LEAF, 900]], 'base');
  const rot = lerp(0, -38, sp(t - T_LEAF, 'heavy'));
  const sc = lerp(1, 1.7, sp(t - T_LEAF - .1, 'heavy'));
  const op = lerp(1, .2, ease.inOut3(range(t, T_LEAF + .25, T_LEAF + .9)));
  M.$('#front').setAttribute('d', `M ${w} 0 C ${w / 3} ${b}, ${-w / 3} ${b}, ${-w} 0`);
  M.$('#back').setAttribute('d', `M ${-w} 0 C ${-w / 3} ${b2}, ${w / 3} ${b2}, ${w} 0`);
  M.$('#lg').setAttribute('transform', `translate(540 ${cy}) rotate(${rot}) scale(${sc})`);
  M.$('#lg').style.opacity = op;
  const draw = ease.out3(range(t, .05, .7));        // يُرسم من اليمين لليسار
  M.$('#front').style.strokeDasharray = '1 1'; M.$('#front').style.strokeDashoffset = 1 - draw;
  M.$('#back').style.opacity = t >= T_LEAF ? 1 : 0;
}

// ---------------------------------------------------------------- الأرضية: كحلي ← تدرّج الهوية يتفتح من مركز الابتسامة
function drawBg(t) {
  const r = ease.out3(range(t, T_FLIP, T_FLIP + .75)) * 2300;
  M.$('#grad').style.clipPath = `circle(${r}px at 540px 1180px)`;
}

const SCENES = [
  { id: 's1', a: 0, b: 3.75,
    setup() { this.w1 = M.words(M.$('#t1'), 'نسبة التسوّس في المملكة تعدّت'); this.w2 = M.words(M.$('#t2'), 'وفيه أسر ما تقدر تعالج.'); },
    draw(t) {
      this.w1.forEach((el, i) => { M.wordIn(el, t, .6 + M.stagger(i, .08), { rise: 30 }); M.wordOut(el, t, 3.35, { lift: -90 }); });
      const big = M.$('#bigv');
      big.textContent = M.counter(Math.round(t * FILM.fps) / FILM.fps, 1.0, 90, { preset: [70, 18] }) + '٪';
      M.slam(big, t, 1.0, { from: 1.35, preset: 'type' }); M.wordOut(big, t, 3.38, { lift: -110 });
      if (t < 1.0) big.style.opacity = 0;
      this.w2.forEach((el, i) => { M.wordIn(el, t, B.at(4) + M.stagger(i, .12)); M.wordOut(el, t, 3.42 + i * .02, { lift: -90 }); });
    } },

  { id: 's2', a: T_FLIP, b: 6.0,
    setup() { this.w3 = M.words(M.$('#t3'), 'هنا جات'); this.w5 = M.words(M.$('#t5in'), 'أول جمعية تطوعية لطب الأسنان بمنطقة مكة المكرمة'); },
    draw(t) {
      const left = -M.seamOut(t, 5.85, .4, 1200);   // الخروج مع التيار: يمين ← يسار
      M.$('#s2').style.transform = `translateX(${left}px)`;
      this.w3.forEach((el, i) => M.wordIn(el, t, 3.9 + M.stagger(i, .1), { rise: 30 }));
      M.slam(M.$('#name'), t, 4.2, { from: 1.8 }); if (t < 4.2) M.$('#name').style.opacity = 0;
      this.w5.forEach((el, i) => M.wordIn(el, t, 4.65 + M.stagger(i, .06), { rise: 26, blur: 8 }));
    } },

  { id: 's3', a: 5.95, b: 11.75,
    setup() { this.rows = [0, 1, 2].map(i => M.$('#r' + i)); },
    draw(t) {
      const tq = Math.round(t * FILM.fps) / FILM.fps;
      this.rows.forEach((r, i) => {
        const at = T_STATS[i];
        let y = 955; for (let j = i + 1; j < 3; j++) y -= 300 * sp(t - T_STATS[j], 'base');   // Nudge: كل رقم جديد يدفع ما فوقه
        const s = sp(t - at, 'type'), out = ease.power4In(range(t, 11.25 + i * .04, 11.5 + i * .04));
        set(r, { y: y + (1 - s) * 50 - out * 120, o: clamp((t - at) / .1) * (1 - out), blur: (1 - clamp(s * 1.3)) * 10 + out * 10 });
        r.querySelector('b').textContent = fmt(Math.round(VALUES[i] * clamp(sp(tq - at, [60, 17]))));   // tq: الأرقام ثابتة داخل الإطار (لا تتلطخ بالإطارات الفرعية)
      });
      M.wordIn(M.$('#footw'), t, 9.95, { rise: 20, blur: 6 }); M.wordOut(M.$('#footw'), t, 11.32, { lift: -40 });
    } },

  { id: 's4', a: T_LEAF, b: 15,
    draw(t) {
      const L = M.$('#logo'), s = sp(t - 12.1, 'heavy');
      set(L, { s: lerp(.55, 1, s), o: clamp((t - 12.1) / .12) });      // الشعار كتلة واحدة: مقياس وشفافية فقط
      M.wordIn(M.$('#slw'), t, 12.6, { rise: 26 });
      const c = M.$('#slc'); c.style.strokeDasharray = '1 1'; c.style.strokeDashoffset = 1 - ease.out3(range(t, 12.85, 13.25));
      const cta = M.$('#cta'), k = sp(t - 13.3, 'ui');
      set(cta, { s: lerp(.6, 1, k), o: clamp((t - 13.3) / .06) });
      set(M.$('#sheen'), { x: lerp(-260, 700, ease.inOut3(range(t, 13.8, 14.35))) });
      M.wordIn(M.$('#urlw'), t, 13.6, { rise: 20, blur: 6 });
    } },
];

SCENES.forEach(s => s.setup && s.setup());
window.FILM = FILM;
window.renderAt = async function (t) {
  drawBg(t);
  for (const s of SCENES) { const on = t >= s.a && t < s.b; M.show(document.getElementById(s.id), on); if (on) s.draw(t); }
  drawLine(t);
};
const logoReady = new Promise(r => { const i = M.$('#logo'); i.complete ? r() : (i.onload = r); });
window.__ready = Promise.all([document.fonts.ready, logoReady]).then(() => Promise.all([...document.fonts].map(f => f.load()))).then(() => window.renderAt(0)).then(() => true);

if (location.search.includes('preview')) {
  const st = document.getElementById('stage');
  const fit = () => { const k = Math.min(innerWidth / FILM.width, innerHeight / FILM.height); st.style.transform = `scale(${k})`; };
  fit(); addEventListener('resize', fit);
  const t0 = performance.now();
  (function loop() { window.renderAt(((performance.now() - t0) / 1000) % FILM.duration); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
