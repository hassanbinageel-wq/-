<style>

  @font-face { font-family:'B'; font-weight:700; src:url('node_modules/@fontsource/baloo-bhaijaan-2/files/baloo-bhaijaan-2-arabic-700-normal.woff2') format('woff2'); }
  @font-face { font-family:'B'; font-weight:800; src:url('node_modules/@fontsource/baloo-bhaijaan-2/files/baloo-bhaijaan-2-arabic-800-normal.woff2') format('woff2'); }

  :root { --dg:#1F5C4A; --ink:#2B2A28; --gold:#D9A441; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#000; overflow:hidden; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:radial-gradient(120% 90% at 40% 40%, #FCE9C8 0%, #F2D2A4 55%, #E2B985 100%); font-family:'B',sans-serif; color:var(--ink); }

  .L { position:absolute; inset:0; }

  .mk { display:inline-block; overflow:hidden; padding:.16em .06em .3em; margin:-.16em 0 -.3em; vertical-align:bottom; }
  .mi { display:inline-block; }

  #world { position:absolute; inset:0; transform-origin:750px 520px; }
  #book { position:absolute; left:90px; top:125px; width:1320px; height:790px; perspective:2600px; }
  #pages { position:absolute; inset:0; overflow:visible; }
  #flip, #cover { position:absolute; left:660px; top:0; width:660px; height:790px; transform-origin:0 50%; backface-visibility:visible; }

  #cover { background:#1F5C4A; border-radius:0 24px 24px 0; border:10px solid #174636; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
  #cover .orn { width:420px; height:420px; border-radius:50%; border:6px dashed rgba(242,193,78,.7); display:flex; align-items:center; justify-content:center; flex-direction:column; }
  #cover b { font:800 120px 'B'; line-height:1.1; color:#F7D37A; }
  #cover small { font:700 36px 'B'; opacity:.85; }
  .bm { position:absolute; display:flex; align-items:center; gap:14px; height:92px; padding:0 30px 0 34px; border-radius:46px; color:#fff; font:800 48px 'B'; }
  .bm i { width:52px; height:52px; border-radius:50%; background:#fff; font:800 34px/52px 'B'; font-style:normal; text-align:center; }

  /* العنوان */
  #title { left:0; top:0; }
  #banner { position:relative; padding:20px 80px 32px; background:var(--dg); color:#fff; border-radius:26px; font:800 116px 'B'; line-height:1.15; white-space:nowrap; }
  #banner:before, #banner:after { content:''; position:absolute; top:36px; width:66px; height:104px; background:#174636; z-index:-1; }
  #banner:before { right:-38px; clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%); }
  #banner:after { left:-38px; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%); }

  /* المقدّم */
  #boy { position:absolute; left:1364px; top:0; width:633px; height:1777px; transform-origin:316px 1777px; }
  #body { position:absolute; left:0; top:404px; }
  #headw { position:absolute; left:0; top:0; width:633px; height:451px; transform-origin:301px 445px; }
  #headw img, #headw svg { position:absolute; left:0; top:0; width:633px; height:451px; }
  #shadow { position:absolute; left:1555px; top:1014px; width:250px; height:40px; border-radius:50%; background:rgba(90,50,20,.3); filter:blur(6px); }
  #bubble { left:1150px; top:190px; }
  #bubble div { background:#fff; border-radius:40px; padding:22px 40px 30px; font:800 56px 'B'; color:var(--dg); position:relative; white-space:nowrap; }
  #bubble div:after { content:''; position:absolute; right:40px; bottom:-26px; border:16px solid transparent; border-top:22px solid #fff; border-left:24px solid #fff; }

  /* الختام */
  #scroll { left:150px; top:150px; width:1260px; padding:40px 50px 46px; background:#FFF9EA; border-radius:40px; border:6px solid var(--gold); text-align:center; }

  #scroll .chips span { background:var(--dg); color:#fff; font:800 40px 'B'; padding:8px 30px 16px; border-radius:40px; }
  .conf { position:absolute; width:22px; height:30px; border-radius:5px; }

  #grain { opacity:.12; mix-blend-mode:multiply; pointer-events:none; }
  #vig { background:radial-gradient(130% 100% at 50% 45%, rgba(0,0,0,0) 62%, rgba(80,40,10,.22) 100%); pointer-events:none; }

<body>

<script>
const P = TIMING.phrases, ENV = TIMING.env;
const FILM = { width: 1920, height: 1080, fps: 30, duration: TIMING.duration, cuts: [] };
const { sp, set, clamp, lerp, ease, range, track } = M; const $ = M.$;
const env = t => { const f = t * TIMING.fps, i = Math.floor(f); const a = ENV[i] || 0, b = ENV[i + 1] || 0; return lerp(a, b, f - i); };
const at = (i, k = 'a') => P[i][k];

function maskWords(el, text) { el.innerHTML = ''; return text.split(/\s+/).filter(Boolean).map(w => { const m = document.createElement('span'); m.className = 'mk'; const s = document.createElement('span'); s.className = 'mi'; s.textContent = w; m.appendChild(s); el.appendChild(m); return s; }); }
function pop(el, t, t0, { preset = 'playful', from = .3, rot = -6, dy = 40 } = {}) { const s = sp(t - t0, preset); set(el, { s: lerp(from, 1, s), y: (1 - s) * dy, r: (1 - s) * rot, o: clamp((t - t0) / .08) }); if (t < t0) el.style.opacity = 0; return s; }
// مجموعات SVG: تحويل بالخاصية حول مركز معلوم
function popG(id, t, t0, cx, cy, { from = .3, rot = -6, preset = 'playful' } = {}) { const el = $('#' + id), s = sp(t - t0, preset), k = Math.max(0, lerp(from, 1, s));
  el.setAttribute('transform', `translate(${cx} ${cy}) rotate(${(1 - s) * rot}) scale(${k}) translate(${-cx} ${-cy})`); el.style.opacity = t < t0 ? 0 : clamp((t - t0) / .08); }
function riseG(id, t, t0) { const el = $('#' + id), s = sp(t - t0, 'type'); el.setAttribute('transform', `translate(0 ${(1 - s) * 34})`); el.style.opacity = t < t0 ? 0 : clamp((t - t0) / .18); }
function wipeG(id, t, t0, dur, x0, x1) { const r = $('#' + id + 'r'), u = ease.inOut3(range(t, t0, t0 + dur)); r.setAttribute('x', x1 - (x1 - x0) * u); r.setAttribute('width', (x1 - x0) * u); }   // كشف من اليمين لليسار

// ---------------------------------------------------------------- رسومات الشخصيات
const SK = '#F6C9A0', LN = '#2B2A28';
function kid(pose = 'stand', cap = '#fff') {
  const arms = pose === 'pray'

       <path d="M40 -175 Q10 -160 -18 -170" stroke="${LN}" stroke-width="26" stroke-linecap="round" fill="none"/><path d="M40 -175 Q10 -160 -18 -170" stroke="#fff" stroke-width="18" stroke-linecap="round" fill="none"/><circle cx="-20" cy="-170" r="11" fill="${SK}" stroke="${LN}" stroke-width="3"/>`
    : pose === 'write'
    ? `<g id="wArm"><path d="M-44 -175 Q-70 -120 -100 -95" stroke="${LN}" stroke-width="26" stroke-linecap="round" fill="none"/><path d="M-44 -175 Q-70 -120 -100 -95" stroke="#fff" stroke-width="18" stroke-linecap="round" fill="none"/><circle cx="-104" cy="-92" r="12" fill="${SK}" stroke="${LN}" stroke-width="3"/><rect x="-128" y="-118" width="8" height="40" rx="3" fill="#F2B632" stroke="${LN}" stroke-width="2" transform="rotate(35 -124 -98)"/></g>
       <path d="M44 -175 Q62 -120 50 -98" stroke="${LN}" stroke-width="26" stroke-linecap="round" fill="none"/><path d="M44 -175 Q62 -120 50 -98" stroke="#fff" stroke-width="18" stroke-linecap="round" fill="none"/>`
    : `<path d="M-46 -175 Q-62 -120 -58 -80" stroke="${LN}" stroke-width="26" stroke-linecap="round" fill="none"/><path d="M-46 -175 Q-62 -120 -58 -80" stroke="#fff" stroke-width="18" stroke-linecap="round" fill="none"/><circle cx="-58" cy="-76" r="11" fill="${SK}" stroke="${LN}" stroke-width="3"/>
       <path d="M46 -175 Q62 -120 58 -80" stroke="${LN}" stroke-width="26" stroke-linecap="round" fill="none"/><path d="M46 -175 Q62 -120 58 -80" stroke="#fff" stroke-width="18" stroke-linecap="round" fill="none"/><circle cx="58" cy="-76" r="11" fill="${SK}" stroke="${LN}" stroke-width="3"/>`;
  return `<ellipse cx="0" cy="4" rx="58" ry="10" fill="#000" opacity=".12"/>
    <rect x="-34" y="-30" width="26" height="30" rx="8" fill="${LN}"/><rect x="8" y="-30" width="26" height="30" rx="8" fill="${LN}"/>
    <path d="M-56 -26 L-46 -186 Q0 -200 46 -186 L56 -26Z" fill="#fff" stroke="${LN}" stroke-width="5" stroke-linejoin="round"/><path d="M0 -186 V-140" stroke="${LN}" stroke-width="3"/>
    ${arms}
    <circle cx="0" cy="-240" r="54" fill="${SK}" stroke="${LN}" stroke-width="5"/>
    <path d="M-54 -248 Q-50 -300 0 -300 Q50 -300 54 -248 Q30 -262 0 -262 Q-30 -262 -54 -248Z" fill="${cap}" stroke="${LN}" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="-19" cy="-236" r="6" fill="${LN}" class="eye"/><circle cx="19" cy="-236" r="6" fill="${LN}" class="eye"/>

    <circle cx="-34" cy="-218" r="8" fill="#F29C8A" opacity=".5"/><circle cx="34" cy="-218" r="8" fill="#F29C8A" opacity=".5"/>`;
}
function teacher() {
  return `<ellipse cx="0" cy="4" rx="70" ry="11" fill="#000" opacity=".12"/>
    <rect x="-40" y="-14" width="30" height="16" rx="7" fill="${LN}"/><rect x="10" y="-14" width="30" height="16" rx="7" fill="${LN}"/>
    <path d="M-70 -10 L-58 -270 Q0 -290 58 -270 L70 -10Z" fill="#fff" stroke="${LN}" stroke-width="5" stroke-linejoin="round"/><path d="M0 -270 V-200" stroke="${LN}" stroke-width="3"/>
    <path d="M-58 -262 Q-84 -180 -76 -120" stroke="${LN}" stroke-width="30" stroke-linecap="round" fill="none"/><path d="M-58 -262 Q-84 -180 -76 -120" stroke="#fff" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M58 -262 Q90 -230 120 -250" stroke="${LN}" stroke-width="30" stroke-linecap="round" fill="none"/><path d="M58 -262 Q90 -230 120 -250" stroke="#fff" stroke-width="22" stroke-linecap="round" fill="none"/><circle cx="124" cy="-252" r="13" fill="${SK}" stroke="${LN}" stroke-width="3"/>
    <circle cx="0" cy="-330" r="50" fill="${SK}" stroke="${LN}" stroke-width="5"/>
    <path d="M-38 -312 Q0 -262 38 -312 Q30 -280 0 -276 Q-30 -280 -38 -312Z" fill="#3A2A20"/>
    <path d="M-62 -330 Q-62 -392 0 -392 Q62 -392 62 -330 L74 -250 L48 -262 L44 -330 Q0 -350 -44 -330 L-48 -262 L-74 -250Z" fill="#fff" stroke="${LN}" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-50" y="-378" width="100" height="14" rx="7" fill="${LN}"/>
    <circle cx="-18" cy="-332" r="5" fill="${LN}"/><circle cx="18" cy="-332" r="5" fill="${LN}"/><path d="M-12 -310 Q0 -302 12 -310" stroke="#F6C9A0" stroke-width="4" fill="none"/>`;
}
const frame = (x, w, c) => `<rect x="${x + 30}" y="34" width="${w - 60}" height="722" rx="26" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>`;
const sign = (txt, col, mark) => `<rect x="-6" y="0" width="12" height="190" rx="5" fill="#9C7A55"/><rect x="-130" y="-46" width="260" height="96" rx="20" fill="${col}" stroke="#fff" stroke-width="6"/><text x="0" y="16" text-anchor="middle" font-family="B" font-weight="800" font-size="46" fill="#fff">${txt} ${mark}</text>`;

// ---------------------------------------------------------------- المشاهد (صفحات الكتاب)
$('#scenes').innerHTML = `
<g id="sc1">
  <rect x="70" y="70" width="520" height="250" rx="14" fill="#2F5D50" stroke="#A8794F" stroke-width="12"/>
  <text x="330" y="140" text-anchor="middle" font-family="K" font-weight="700" font-size="44" fill="#F4F1E6">الواجب ✎</text>

  <g id="door"><rect x="70" y="380" width="150" height="330" rx="8" fill="#C79A68" stroke="#8C6440" stroke-width="6"/><g id="doorleaf"><rect x="76" y="386" width="138" height="318" rx="6" fill="#B5865A"/><circle cx="196" cy="550" r="9" fill="#F2C14E"/></g></g>

  <g id="teach"><g transform="translate(420 740) scale(.95)">${teacher()}</g></g>

  <rect x="760" y="570" width="500" height="28" rx="8" fill="#A8794F"/><rect x="790" y="598" width="440" height="150" rx="6" fill="#C79A68"/><rect x="800" y="598" width="20" height="160" fill="#8C6440"/><rect x="1200" y="598" width="20" height="160" fill="#8C6440"/>

  <g id="bdg1"><rect x="760" y="80" width="220" height="86" rx="43" fill="#3E7FB0"/><text x="870" y="137" text-anchor="middle" font-family="B" font-weight="800" font-size="44" fill="#fff">تركيز 🎯</text></g>
  <g id="bdg2"><rect x="1010" y="80" width="220" height="86" rx="43" fill="#3BA57A"/><text x="1120" y="137" text-anchor="middle" font-family="B" font-weight="800" font-size="44" fill="#fff">إتقان ✓</text></g>
  <g id="sees"><ellipse cx="990" cy="150" rx="290" ry="120" fill="url(#gl)"/><rect x="730" y="80" width="520" height="136" rx="30" fill="#FFF6D5" stroke="#F2C14E" stroke-width="6"/>
    <text x="990" y="136" text-anchor="middle" font-family="B" font-weight="800" font-size="46" fill="#1F5C4A">اللهُ يرانا</text><text x="990" y="192" text-anchor="middle" font-family="B" font-weight="700" font-size="38" fill="#6A5A3A">ويعلمُ ما نعمل</text></g>
  <g id="good"><rect x="760" y="240" width="460" height="80" rx="40" fill="#D9A441"/><text x="990" y="294" text-anchor="middle" font-family="B" font-weight="800" font-size="38" fill="#fff">نحرصُ على الخيرِ دائمًا ⭐</text></g>
  <g id="neat"><circle cx="1090" cy="500" r="30" fill="#3BA57A"/><path d="M1076 500 L1087 512 L1106 488" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g id="sc3">
  ${frame(660, 660, '#D9A441')}${frame(0, 660, '#D9A441')}
  <text id="h30" x="990" y="150" text-anchor="middle" font-family="B" font-weight="800" font-size="50" fill="#D9A441">الإحسانُ هو:</text>
  <clipPath id="w31"><rect id="w31r" x="660" y="200" width="0" height="360"/></clipPath>
  <g clip-path="url(#w31)"><text x="990" y="330" text-anchor="middle" font-family="N" font-weight="700" font-size="84" fill="#1F5C4A">«أن تعبدَ اللهَ</text><text x="990" y="470" text-anchor="middle" font-family="N" font-weight="700" font-size="84" fill="#1F5C4A">كأنَّكَ تراه»</text></g>

if (location.search.includes('preview')) {
  const st = document.getElementById('stage');
  const fit = () => { const k = Math.min(innerWidth / FILM.width, innerHeight / FILM.height); st.style.transform = `scale(${k})`; st.style.transformOrigin = '0 0'; };
  fit(); addEventListener('resize', fit);
  const a = new Audio('out/score.wav'); const t0 = performance.now(); a.play().catch(() => {});
  (function loop() { window.renderAt(((performance.now() - t0) / 1000) % FILM.duration); requestAnimationFrame(loop); })();
}
