plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanoo.run'
    compileSdk 34

    defaultConfig {
        applicationId "com.hanoo.run"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // The game itself lives in ../hanoo-game and is packed into the app as-is.
    sourceSets {
        main {
            assets.srcDirs = ['../../hanoo-game']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
